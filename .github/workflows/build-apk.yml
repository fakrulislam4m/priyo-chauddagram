name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK Environment
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses & Ensure API 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if command -v sdkmanager > /dev/null 2>&1; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Configure Google Services
        run: |
          mkdir -p android/app
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "645062772426",
              "firebase_url": "https://gen-lang-client-0431558891-default-rtdb.firebaseio.com",
              "project_id": "gen-lang-client-0431558891",
              "storage_bucket": "gen-lang-client-0431558891.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:645062772426:android:b84b5f18f8dc0ba1521633",
                  "android_client_info": {
                    "package_name": "com.priyodigitallab.priyochauddagram"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "645062772426-4s7ij0hph3rlkk5gdfonkr8o63vrjsgk.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAW0lU07KcDzkn73OYsB0c7kiVOle_70Ko"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "Verified android/app/google-services.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle Web Application into Android Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/web
          cp -r dist/* android/app/src/main/assets/web/
          echo "Web application assets bundled into android/app/src/main/assets"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Priyo-Chauddagram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Priyo Chauddagram v1.0.${{ github.run_number }}"
          body: "Direct APK download for Priyo Chauddagram Android app."
          files: android/app/build/outputs/apk/debug/app-debug.apk

